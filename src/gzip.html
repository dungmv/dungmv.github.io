<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./input.css" rel="stylesheet">
    <title>Gzip Decompressor - DevTools</title>
</head>
<body>
    <div class="max-w-5xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        <!-- Back Navigation & Title -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-650 transition-colors group mb-4">
                <svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-3xl font-extrabold text-slate-900">Gzip Decompressor</h1>
            <p class="text-sm text-slate-500 mt-1">Decompress gzip-compressed payloads back to readable plaintext. Fully client-side.</p>
        </div>


        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Input Card -->
            <div class="glass-panel rounded-2xl p-6 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label id="input-label" for="input" class="text-sm font-semibold tracking-wide uppercase text-slate-600">Gzip Source (Base64)</label>
                        <span id="input-stats" class="text-xs text-slate-400">0 characters</span>
                    </div>
                    <textarea 
                        id="input" 
                        class="w-full h-80 bg-white border border-slate-200 rounded-xl p-4 text-slate-800 font-mono text-sm focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 transition-all resize-none"
                        placeholder="Enter Gzip Base64 payload to decompress..."
                    ></textarea>
                </div>
                <div class="mt-4 flex gap-3">
                    <select id="input-format" class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-slate-700 text-sm font-semibold focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 transition-all shadow-sm">
                        <option value="base64">Gzip Base64</option>
                        <option value="hex">Gzip Hex</option>
                    </select>
                    <button id="process-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 px-4 rounded-xl shadow-sm active:scale-95 transition-all">
                        Decompress Gzip
                    </button>
                    <button id="clear" class="bg-white hover:bg-slate-50 text-slate-500 hover:text-slate-700 p-2.5 rounded-xl border border-slate-200 active:scale-95 transition-all" title="Clear input">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Output Card -->
            <div class="glass-panel rounded-2xl p-6 flex flex-col justify-between glow-cyan">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label id="output-label" for="output" class="text-sm font-semibold tracking-wide uppercase text-slate-600">Decoded Plaintext</label>
                        <div class="flex gap-4 items-center">
                            <span id="output-stats" class="text-xs text-slate-400">0 characters</span>
                            <span id="copy-status" class="text-xs text-emerald-600 opacity-0 transition-opacity duration-300">Copied!</span>
                        </div>
                    </div>
                    <textarea 
                        disabled 
                        id="output" 
                        class="w-full h-80 bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-850 font-mono text-sm resize-none"
                        placeholder="Decompressed plaintext will appear here..."
                    ></textarea>
                </div>
                <div class="mt-4">
                    <button id="copy" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-semibold py-2.5 px-4 rounded-xl border border-slate-200 flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        Copy Output
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const inputStatsEl = document.getElementById('input-stats');
        const outputStatsEl = document.getElementById('output-stats');
        const processBtn = document.getElementById('process-btn');
        const clearBtn = document.getElementById('clear');
        const copyBtn = document.getElementById('copy');
        const copyStatus = document.getElementById('copy-status');
        const formatSelect = document.getElementById('input-format');
        const inputLabel = document.getElementById('input-label');

        // Placeholder configurations
        const formatConfig = {
            'base64': {
                label: 'Gzip Source (Base64)',
                placeholder: 'Enter Gzip Base64 payload to decompress...'
            },
            'hex': {
                label: 'Gzip Source (Hex)',
                placeholder: 'Enter Gzip Hexadecimal payload (e.g., 1f8b08...)...'
            }
        };

        // Format selector change listener
        formatSelect.addEventListener('change', () => {
            const config = formatConfig[formatSelect.value];
            inputLabel.innerText = config.label;
            inputEl.placeholder = config.placeholder;
            // Clear only output fields, keep input fields intact
            outputEl.value = "";
            outputStatsEl.innerText = "0 characters";
        });

        // Input statistics tracker
        inputEl.addEventListener('input', () => {
            const length = inputEl.value.length;
            inputStatsEl.innerText = `${length.toLocaleString()} character${length !== 1 ? 's' : ''}`;
        });

        // Run Decompression
        processBtn.addEventListener('click', async () => {
            const val = inputEl.value.trim();
            if (!val) {
                alert("Please enter input Gzip payload first!");
                return;
            }

            const format = formatSelect.value;
            let bytes;

            try {
                if (format === 'base64') {
                    // Base64 to Uint8Array
                    const binaryString = atob(val);
                    bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                } else if (format === 'hex') {
                    // Hex to Uint8Array
                    const cleanHex = val.replace(/\s+/g, '');
                    if (!/^[0-9a-fA-F]+$/.test(cleanHex)) {
                        throw new Error("Input contains invalid non-hexadecimal characters.");
                    }
                    if (cleanHex.length % 2 !== 0) {
                        throw new Error("Hexadecimal input must have an even number of characters.");
                    }
                    bytes = new Uint8Array(cleanHex.length / 2);
                    for (let i = 0; i < cleanHex.length; i += 2) {
                        bytes[i / 2] = parseInt(cleanHex.substr(i, 2), 16);
                    }
                }

                // Decompress using native DecompressionStream Web API
                const stream = new Response(bytes).body;
                const decompressedStream = stream.pipeThrough(new DecompressionStream('gzip'));
                const text = await new Response(decompressedStream).text();
                
                outputEl.value = text;
                const outputLength = text.length;
                outputStatsEl.innerText = `${outputLength.toLocaleString()} character${outputLength !== 1 ? 's' : ''}`;
            } catch (err) {
                alert(`Decompression failed.\nMake sure your input is a valid Gzip ${format === 'base64' ? 'Base64' : 'Hex'} payload.\n\nDetails: ${err.message}`);
                outputEl.value = "";
                outputStatsEl.innerText = "0 characters";
            }
        });

        // Clear button
        clearBtn.addEventListener('click', clearFields);

        function clearFields() {
            inputEl.value = "";
            outputEl.value = "";
            inputStatsEl.innerText = "0 characters";
            outputStatsEl.innerText = "0 characters";
        }

        // Copy output button
        copyBtn.addEventListener('click', () => {
            if (!outputEl.value) return;
            navigator.clipboard.writeText(outputEl.value).then(() => {
                copyStatus.style.opacity = "1";
                setTimeout(() => {
                    copyStatus.style.opacity = "0";
                }, 2000);
            });
        });
    </script>
</body>
</html>
