<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./input.css" rel="stylesheet">
    <title>MetaMask Message Signer - DevTools</title>
</head>
<body>
    <div class="max-w-xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        <!-- Back Navigation & Title -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-purple-600 transition-colors group mb-4">
                <svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-3xl font-extrabold text-slate-900">MetaMask Signer</h1>
            <p class="text-sm text-slate-500 mt-1">Cryptographically sign arbitrary messages with your private key.</p>
        </div>

        <!-- Connection Status Banner -->
        <div id="status-banner" class="glass-panel rounded-2xl p-4 mb-6 flex items-center justify-between border-l-4 border-l-amber-500 bg-amber-50/50">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse" id="status-dot"></div>
                <div>
                    <span class="text-xs text-slate-500 block font-semibold uppercase tracking-wider">Wallet Connection</span>
                    <span class="text-sm font-bold text-slate-700" id="status-text">Checking for MetaMask...</span>
                </div>
            </div>
            <div id="account-badge" class="hidden text-xs bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-600 font-mono">
                <!-- Shortened Address -->
            </div>
        </div>

        <!-- Tool Panel -->
        <div class="glass-panel rounded-2xl p-6 glow-purple">
            <!-- Form -->
            <div class="space-y-5">
                <div>
                    <label for="msg" class="text-sm font-semibold tracking-wide uppercase text-slate-600 block mb-2">Message to Sign</label>
                    <textarea 
                        id="msg" 
                        class="w-full h-24 bg-white border border-slate-200 rounded-xl p-3 text-slate-800 text-sm focus:outline-none focus:border-purple-500/50 focus:ring-1 focus:ring-purple-500/50 transition-all resize-none"
                        placeholder="Enter the message text here..."
                    ></textarea>
                </div>

                <div>
                    <button id="sign" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white text-sm font-semibold py-3 px-4 rounded-xl shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                        </svg>
                        Sign Message
                    </button>
                </div>

                <!-- Result Area -->
                <div class="pt-4 border-t border-slate-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold tracking-wide uppercase text-slate-600">Generated Signature</label>
                        <span id="copy-status" class="text-xs text-emerald-600 opacity-0 transition-opacity duration-300">Copied!</span>
                    </div>
                    <div class="flex gap-2">
                        <input 
                            type="text" 
                            id="hash" 
                            readonly
                            placeholder="Your signature will appear here..." 
                            class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 font-mono focus:outline-none"
                        >
                        <button id="copy" disabled class="bg-white hover:bg-slate-50 disabled:opacity-40 text-slate-500 hover:text-slate-700 px-4 rounded-xl border border-slate-200 active:scale-95 transition-all text-xs font-semibold">
                            Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.7.3/web3.min.js" integrity="sha512-Ws+qbaGHSFw2Zc1e7XRpvW+kySrhmPLFYTyQ95mxAkss0sshj6ObdNP3HDWcwTs8zBJ60KpynKZywk0R8tG1GA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusBanner = document.getElementById('status-banner');
        const accountBadge = document.getElementById('account-badge');
        const signBtn = document.getElementById('sign');
        const msgInput = document.getElementById('msg');
        const signInput = document.getElementById('hash');
        const copyBtn = document.getElementById('copy');
        const copyStatus = document.getElementById('copy-status');

        let web3Instance;
        let isMetaMaskInstalled = false;

        // Initialize status detection
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.ethereum !== 'undefined') {
                isMetaMaskInstalled = true;
                web3Instance = new Web3(window.ethereum);
                
                // Show MetaMask Found but disconnected state
                statusText.innerText = "MetaMask Detected";
                statusBanner.className = "glass-panel rounded-2xl p-4 mb-6 flex items-center justify-between border-l-4 border-l-indigo-500 bg-indigo-50/50";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse";
                signBtn.removeAttribute('disabled');
            } else {
                statusText.innerText = "MetaMask Not Installed";
                statusBanner.className = "glass-panel rounded-2xl p-4 mb-6 flex items-center justify-between border-l-4 border-l-rose-500 bg-rose-50/50 text-rose-800";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                msgInput.setAttribute('disabled', 'true');
            }
        });

        // Trigger sign workflow
        signBtn.addEventListener('click', async () => {
            if (!isMetaMaskInstalled) return;
            
            try {
                // Change UI state during prompt
                signBtn.innerText = "Check Wallet Request...";
                signBtn.setAttribute('disabled', 'true');
                
                // Prompt user to connect their wallet
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];
                
                // Update header connection state
                const shortAddress = account.slice(0, 6) + '...' + account.slice(-4);
                accountBadge.innerText = shortAddress;
                accountBadge.classList.remove('hidden');
                
                statusText.innerText = "Wallet Connected";
                statusBanner.className = "glass-panel rounded-2xl p-4 mb-6 flex items-center justify-between border-l-4 border-l-emerald-500 bg-emerald-50/50 text-emerald-800";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                
                // Collect message and sign
                const msg = msgInput.value;
                if (!msg) {
                    alert("Please enter a message to sign!");
                    resetSignButton();
                    return;
                }

                const hexMsg = web3Instance.utils.utf8ToHex(msg);
                const signature = await web3Instance.eth.personal.sign(hexMsg, account);
                
                signInput.value = signature;
                copyBtn.removeAttribute('disabled');
            } catch (err) {
                console.error("Signature workflow error: ", err);
                alert("Operation failed/rejected by user.\nError: " + err.message);
                signInput.value = "";
                copyBtn.setAttribute('disabled', 'true');
            } finally {
                resetSignButton();
            }
        });

        function resetSignButton() {
            signBtn.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                </svg>
                Sign Message
            `;
            signBtn.removeAttribute('disabled');
        }

        // Copy button trigger
        copyBtn.addEventListener('click', () => {
            if (!signInput.value) return;
            
            navigator.clipboard.writeText(signInput.value).then(() => {
                copyStatus.style.opacity = "1";
                setTimeout(() => {
                    copyStatus.style.opacity = "0";
                }, 2000);
            }).catch(err => {
                console.error("Copy failed: ", err);
            });
        });
    </script>
</body>
</html>
